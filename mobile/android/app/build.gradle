plugins { id 'com.android.application' }
def origin = providers.gradleProperty('forteOrigin').getOrElse('https://forte-delta.vercel.app')
def uri = new URI(origin)
if (uri.scheme != 'https' || !uri.host || uri.rawUserInfo || uri.rawQuery || uri.rawFragment || !(uri.path in ['', '/']) || (uri.port != -1 && uri.port != 443)) {
    throw new GradleException('forteOrigin must be an HTTPS origin without credentials, path, query, or nonstandard port')
}
android {
    namespace 'com.lewdoherz.forte'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.lewdoherz.forte'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'FORTE_ORIGIN', '"' + origin + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
}
