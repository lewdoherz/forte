plugins { id 'com.android.application' }
def origin = providers.gradleProperty('forteOrigin').getOrElse('https://forte-delta.vercel.app')
def uri = new URI(origin)
if (uri.scheme != 'https' || !uri.host || uri.rawUserInfo || uri.rawQuery || uri.rawFragment || !(uri.path in ['', '/']) || (uri.port != -1 && uri.port != 443)) {
    throw new GradleException('forteOrigin must be an HTTPS origin without credentials, path, query, or nonstandard port')
}
origin = origin.endsWith('/') ? origin.substring(0, origin.length() - 1) : origin
def signingValues = ['FORTE_KEYSTORE_PATH', 'FORTE_KEYSTORE_PASSWORD', 'FORTE_KEY_ALIAS', 'FORTE_KEY_PASSWORD'].collectEntries {
    [(it): providers.environmentVariable(it).orNull]
}
def signingReady = signingValues.values().every { it != null && !it.isEmpty() }
android {
    namespace 'com.lewdoherz.forte'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.lewdoherz.forte'
        minSdk 30
        targetSdk 36
        versionCode 4
        versionName '1.2.0'
        buildConfigField 'String', 'FORTE_ORIGIN', '"' + origin + '"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(signingValues.FORTE_KEYSTORE_PATH)
                storePassword signingValues.FORTE_KEYSTORE_PASSWORD
                keyAlias signingValues.FORTE_KEY_ALIAS
                keyPassword signingValues.FORTE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources {
        // Default AAPT2 ignores underscore-prefixed files/dirs; keep Next.js static chunks intact.
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    sourceSets {
        main {
            assets.srcDirs += layout.buildDirectory.dir('generated/offline-assets')
        }
    }
}
def prepareOfflineAssets = tasks.register('prepareOfflineAssets', Sync) {
    def repoRoot = rootProject.projectDir.parentFile.parentFile
    def offlineDist = new File(repoRoot, 'mobile/offline-dist')
    def publicDir = new File(repoRoot, 'public')
    into layout.buildDirectory.dir('generated/offline-assets/www')
    from(new File(offlineDist, 'android/offline-app.html'))
    from(new File(offlineDist, '_next/static')) { into 'next-static' }
    from(new File(publicDir, 'offline-catalog.json'))
    from(new File(publicDir, 'exercise-media/thumbnails')) { into 'exercise-media/thumbnails' }
    from(new File(publicDir, 'body-heatmap')) { into 'body-heatmap' }
    from(new File(publicDir, 'audio')) { into 'audio' }
    doFirst {
        if (!new File(offlineDist, 'android/offline-app.html').isFile()) {
            throw new GradleException('Missing mobile/offline-dist/android/offline-app.html. Run `bun run mobile:bundle` first.')
        }
        if (!new File(publicDir, 'offline-catalog.json').isFile()) {
            throw new GradleException('Missing public/offline-catalog.json. Run `bun run mobile:bundle` first.')
        }
    }
}
tasks.named('preBuild') {
    dependsOn(prepareOfflineAssets)
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.browser:browser:1.8.0'
}
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') } && !signingReady) {
        throw new GradleException('Release signing requires FORTE_KEYSTORE_PATH, FORTE_KEYSTORE_PASSWORD, FORTE_KEY_ALIAS, and FORTE_KEY_PASSWORD')
    }
}
