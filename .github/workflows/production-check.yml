name: Production check

# TEMPORARY harness, manual trigger only.
#
# The development machine's network DNS-poisons *.vercel.app, so production can
# only be reached from a runner. Reports what the deployment actually serves,
# which is how a deploy is confirmed without access to the Vercel API.
#
# Removed once the results are recorded.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check deployment
    runs-on: ubuntu-latest
    env:
      BASE: https://forte-delta.vercel.app
    steps:
      - name: Which code is live
        run: |
          for path in /sign-in /forgot-password /reset-password /verify-email; do
            printf '%s -> %s\n' "$path" "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE$path")"
          done

      - name: Owner-facing mail path works in production
        run: |
          printf 'reset request -> %s\n' "$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "$BASE/api/auth/request-password-reset" \
            -H 'content-type: application/json' \
            -d '{"email":"lihp1987@gmail.com","redirectTo":"/reset-password"}')"
          printf 'signup of a non-owner address -> %s\n' "$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "$BASE/api/auth/sign-up/email" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"probe-${GITHUB_RUN_ID}@forte-probe.invalid\",\"password\":\"Probe-Password-Aa1\",\"name\":\"Probe\"}")"
